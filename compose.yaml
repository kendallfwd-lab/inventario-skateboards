services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-del_valle_inventory}
      MYSQL_USER: ${DB_USER:-delvalle_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"]
    volumes: ["mysql_data:/var/lib/mysql", "./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro", "./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    env_file: [.env]
    environment: {DB_HOST: mysql, DB_PORT: 3306, PORT: 3010, FRONTEND_URL: http://localhost:8080}
    ports: ["127.0.0.1:3010:3010"]
    depends_on: {mysql: {condition: service_healthy}}
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]
volumes:
  mysql_data:

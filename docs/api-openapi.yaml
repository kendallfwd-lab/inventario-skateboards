openapi: 3.1.0
info: {title: Skateboards Business API, version: 1.0.0}
servers: [{url: http://localhost:3010}]
components:
  securitySchemes: {sessionCookie: {type: apiKey, in: cookie, name: dv_session}}
  schemas:
    Error: {type: object, properties: {error: {type: string}}}
security: [{sessionCookie: []}]
paths:
  /api/health: {get: {security: [], responses: {'200': {description: MySQL status}}}}
  /api/auth/login: {post: {security: [], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email,password], properties: {email: {type: string, format: email}, password: {type: string}}}}}}, responses: {'200': {description: Session created}, '401': {description: Invalid credentials}}}}
  /api/dashboard/resumen: {get: {responses: {'200': {description: Operational KPIs}}}}
  /api/admin/dashboard/summary: {get: {summary: Dashboard comercial y financiero, description: Distingue las solicitudes de pedidos de las ventas registradas y reporta cobros desde el ledger de pedidos., parameters: [{in: query, name: from, schema: {type: string, format: date}}, {in: query, name: to, schema: {type: string, format: date}}], responses: {'200': {description: KPIs, estados de pedidos y cobros registrados}}}}
  /api/materiales: {get: {responses: {'200': {description: Material catalog}}}, post: {responses: {'201': {description: Created}}}}
  /api/proveedores: {get: {responses: {'200': {description: Suppliers}}}, post: {responses: {'201': {description: Created}}}}
  /api/movimientos: {get: {responses: {'200': {description: Ledger}}}, post: {responses: {'201': {description: Movement confirmed}, '409': {description: Insufficient stock}}}}
  /api/ordenes/posibles-duplicados: {get: {responses: {'200': {description: Review candidates only}}}}
  /api/reportes/fuga-valor: {get: {responses: {'200': {description: Contract price comparison}}}}
  /api/ai/chat: {post: {responses: {'200': {description: Gemini response}, '503': {description: Gemini not configured}}}}

  /api/requisiciones: {get: {responses: {'200': {description: Requisitions}}}, post: {responses: {'201': {description: Created}}}}
  /api/cotizaciones: {get: {responses: {'200': {description: Supplier quotes}}}, post: {responses: {'201': {description: Created}}}}
  /api/recepciones: {post: {responses: {'201': {description: Receipt matched to purchase order and stock ledger}}}}
  /api/facturas: {get: {responses: {'200': {description: Invoices}}}, post: {responses: {'201': {description: Recorded after three-way match}}}}
  /api/pagos-registrados: {get: {responses: {'200': {description: Recorded payments}}}, post: {responses: {'201': {description: Recorded without bank transaction}}}}
  /api/criterios-evaluacion: {get: {responses: {'200': {description: Weighted supplier criteria}}}}
  /api/crm/customers: {get: {summary: Lista clientes CRM, parameters: [{in: query, name: q, schema: {type: string}}], responses: {'200': {description: Clientes activos con perfil, consentimiento y métricas}}}, post: {summary: Registra cliente, responses: {'201': {description: Cliente creado sin consentimiento promocional}, '409': {description: Contacto duplicado}}}}
  /api/crm/customers/{id}: {get: {summary: Detalle CRM, parameters: [{in: path, name: id, required: true, schema: {type: integer}}], responses: {'200': {description: Perfil, ventas, pedidos, seguimientos y consentimientos}, '404': {description: Cliente no encontrado}}}, patch: {summary: Actualiza perfil CRM, parameters: [{in: path, name: id, required: true, schema: {type: integer}}], responses: {'200': {description: Perfil actualizado}}}}
  /api/crm/customers/{id}/consents: {post: {summary: Registra consentimiento otorgado o retirado, parameters: [{in: path, name: id, required: true, schema: {type: integer}}], responses: {'201': {description: Evento de consentimiento creado}}}}
  /api/crm/customers/{id}/followups: {post: {summary: Crea seguimiento o nota, parameters: [{in: path, name: id, required: true, schema: {type: integer}}], responses: {'201': {description: Seguimiento creado}}}}
  /api/crm/followups/{id}: {patch: {summary: Cierra seguimiento, parameters: [{in: path, name: id, required: true, schema: {type: integer}}], responses: {'200': {description: Seguimiento actualizado}}}}
  /api/crm/customers/{id}/orders/{orderId}: {post: {summary: Vincula pedido existente a cliente, parameters: [{in: path, name: id, required: true, schema: {type: integer}}, {in: path, name: orderId, required: true, schema: {type: integer}}], responses: {'200': {description: Pedido vinculado}, '409': {description: Pedido vinculado a otro cliente}}}}
  /api/promotions: {get: {summary: Lista campañas de descuentos, responses: {'200': {description: Campañas, vigencia y redenciones}}}, post: {summary: Crea un código de promoción, responses: {'201': {description: Campaña creada}, '409': {description: Código duplicado}}}}
  /api/promotions/{id}: {patch: {summary: Activa o pausa una promoción, parameters: [{in: path, name: id, required: true, schema: {type: integer}}], responses: {'200': {description: Estado actualizado}, '404': {description: Promoción no encontrada}}}}
  /api/store/promotions/validate: {post: {security: [], summary: Cotiza un código para el carrito sin crear pedido, requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code,items], properties: {code: {type: string}, items: {type: array, items: {type: object, required: [variantId,quantity], properties: {variantId: {type: integer}, quantity: {type: integer}}}}}}}}}, responses: {'200': {description: Subtotal, descuento y total calculados}, '422': {description: Código inválido o carrito no elegible}}}}
  /api/store/orders: {get: {summary: Lista pedidos y saldo cobrado, responses: {'200': {description: Pedidos de tienda con vínculo CRM, promociones y cobros netos}}}, post: {security: [], summary: Crea una solicitud de pedido, description: El precio se recalcula en el servidor; el código promocional es opcional y no se combina con otro., responses: {'201': {description: Solicitud creada con subtotal, descuento y total}, '409': {description: Variante o promoción dejó de estar disponible}}}}
  /api/store/orders/{id}/payments: {get: {summary: Historial de cobros y reembolsos, parameters: [{in: path, name: id, required: true, schema: {type: integer}}], responses: {'200': {description: Eventos del ledger}}}, post: {summary: Registra cobro recibido, parameters: [{in: path, name: id, required: true, schema: {type: integer}}], responses: {'201': {description: Cobro creado}, '409': {description: Saldo insuficiente, estado no aceptado o idempotencia incompatible}}}}
  /api/store/orders/{id}/refunds: {post: {summary: Registra reembolso de un cobro, parameters: [{in: path, name: id, required: true, schema: {type: integer}}], responses: {'201': {description: Reembolso creado}, '409': {description: Importe superior al saldo reembolsable}}}}
